<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="国际象棋">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">
<title>国际象棋</title>
<style>
  :root {
    --bg: #F6F4F0;
    --surface: #FFFFFF;
    --border: #E4E0D8;
    --text: #2C2C2A;
    --muted: #8E8B84;
    --accent: #4E7C6A;
    --accent-dark: #3C6253;
    --accent-soft: #E6EEE9;
    --light-sq: #F1ECE2;
    --dark-sq: #A7B69D;
    --danger: #C25B4E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #F6F4F0; color: #2C2C2A;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; min-width: 0; }
  .screen.active { display: flex; }

  /* ---------------- 通用 ---------------- */
  .btn {
    border: 1px solid #E4E0D8; background: #FFFFFF; color: #2C2C2A;
    border-radius: 12px; font-size: 16px; padding: 12px 16px; cursor: pointer;
    font-family: inherit; transition: background .12s, border-color .12s;
    white-space: nowrap; flex: 0 0 auto;
  }
  .btn:active { background: #EFEDE7; }
  .btn.primary { background: #4E7C6A; border-color: #4E7C6A; color: #fff; font-size: 17px; }
  .btn.primary:active { background: #3C6253; }
  .btn.ghost { background: transparent; border-color: transparent; color: #8E8B84; }
  .btn.small { font-size: 14px; padding: 8px 12px; border-radius: 10px; }
  .btn.on { background: #4E7C6A; border-color: #4E7C6A; color: #fff; }

  /* ---------------- 主页 ---------------- */
  #screen-home { align-items: center; justify-content: center; padding: 24px; }
  .logo { font-size: 64px; color: #4E7C6A; opacity: .55; line-height: 1; margin-bottom: 4px; }
  .logo svg { width: 84px; height: 84px; display: block; }
  .title { font-size: 34px; font-weight: 700; letter-spacing: 2px; margin: 10px 0 6px; }
  .divider { width: 56px; height: 3px; background: #4E7C6A; border-radius: 2px; margin: 6px 0 10px; }
  .subtitle { color: #8E8B84; font-size: 13px; margin-bottom: 34px; }
  .home-btns { width: 320px; max-width: 86vw; display: block; }
  .home-btns .btn { display: block; width: 100%; margin-bottom: 14px; }
  .home-btns .btn { padding: 16px; }
  .foot { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
          color: #8E8B84; font-size: 12px; }

  /* ---------------- 难度 ---------------- */
  .topbar {
    display: flex; align-items: center;
    padding: 8px 12px;
    background: #F6F4F0;
  }
  .topbar > * + * { margin-left: 8px; }
  .topbar .spacer { flex: 1 1 auto; min-width: 0; }
  .topbar > * { flex: 0 0 auto; }
  .topbar .titleblock { min-width: 0; overflow: hidden; }
  .topbar .heading { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .heading { font-size: 17px; font-weight: 700; }
  .topbar .sub { font-size: 11px; color: #8E8B84; }
  .diff-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 12px 16px; }
  .diff-head { text-align: center; margin: 6px 0 14px; }
  .diff-head .h1 { font-size: 24px; font-weight: 700; }
  .diff-head .h2 { font-size: 12.5px; color: #8E8B84; margin-top: 6px; }
  .tiles { display: block; margin: 0 -5px; }
  .tile { display: inline-block; width: 25%; padding: 0 5px; margin-bottom: 10px;
          vertical-align: top; box-sizing: border-box; }
  .tile .tile-inner { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px;
                      padding: 10px 4px 8px; text-align: center; }
  @media (min-width: 620px) { .tile { width: 20%; } }
  .tile, .tile .tile-inner { cursor: pointer; }
  .tile:active .tile-inner, .tile.hl .tile-inner { background: #E6EEE9; border-color: #4E7C6A; }
  .tile .elo { font-size: 19px; font-weight: 700; }
  .tile .tier { font-size: 11px; color: #8E8B84; margin-top: 3px; }
  .diff-hint { text-align: center; color: #8E8B84; font-size: 12.5px; margin: 16px 0 4px; min-height: 18px; }

  /* 执白 / 执黑 二选一 */
  .side-caption { text-align: center; color: #8E8B84; font-size: 11.5px; margin: 10px 0 6px; }
  .side-pick { display: flex; justify-content: center; margin-bottom: 2px; }
  .side-pick .side-btn { padding: 10px 14px; font-size: 14px; }
  .side-pick .side-btn + .side-btn { margin-left: 10px; }
  .side-pick .side-btn.on { background: #E6EEE9; border-color: #4E7C6A; color: #3C6253; font-weight: 700; }
  /* 开关类按钮的"已开启"状态（与桌面版 Highlighted 一致） */
  .actions .btn.on { background: #E6EEE9; border-color: #4E7C6A; color: #3C6253; font-weight: 700; }

  /* ---------------- 对局 ---------------- */
  .game-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: block; }
  .board-area { display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .board-wrap { position: relative; }
  canvas#board { display: block; touch-action: manipulation; border-radius: 6px; max-width: 100%; }
  .side { padding: 8px 12px 16px; display: block; }
  .side > * { margin-bottom: 8px; }
  .row { display: flex; align-items: center; }
  .row > * + * { margin-left: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(44,44,42,.45); flex: 0 0 auto; }
  .dot.white { background: #fff; }
  .dot.black { background: #33322E; }
  .turn { font-size: 15px; font-weight: 700; }
  .round { margin-left: auto; font-size: 12px; color: #8E8B84; }
  .status { font-size: 12.5px; color: #8E8B84; min-height: 17px; }
  .status.check { color: #C25B4E; font-weight: 700; }
  .actions { display: flex; }
  .actions .btn + .btn { margin-left: 10px; }
  .actions .btn { flex: 1; }
  .moves { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 6px 10px;
           font-size: 13.5px; max-height: 20vh; overflow-y: auto; }
  .moves .empty { color: #8E8B84; text-align: center; padding: 10px 0; font-size: 12.5px; }
  .mv { display: flex; padding: 3px 0; }
  .mv > * + * { margin-left: 6px; }
  .mv.cur { background: #E6EEE9; border-radius: 6px; }
  .mv .no { color: #8E8B84; width: 26px; flex: 0 0 auto; }
  .mv .san { width: 62px; flex: 0 0 auto; }
  .mv .sym { font-weight: 700; }
  .mv .san2 { width: 62px; flex: 0 0 auto; }
  .mv .sym2 { font-weight: 700; }

  /* ---------------- AI 解析 ---------------- */
  .analysis { display: none;
              background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px; }
  .analysis > * + * { margin-top: 8px; }
  .analysis.on { display: block; }
  .an-head { display: flex; align-items: baseline; }
  .an-head > * + * { margin-left: 8px; }
  .an-title { font-size: 13px; font-weight: 700; }
  .an-note { font-size: 11px; color: #8E8B84; margin-left: auto; }
  .an-rate { display: flex; align-items: baseline; justify-content: center; text-align: center; }
  .an-rate > * + * { margin-left: 8px; }
  .an-rate .big { font-size: 28px; font-weight: 700; color: #3C6253; }
  .an-rate .lbl { font-size: 12px; color: #8E8B84; }
  .an-rate .eval { font-size: 14px; font-weight: 700; }
  .an-cap { font-size: 11px; color: #8E8B84; }
  canvas#chart { width: 100%; height: 84px; display: block; }
  .grades { font-size: 12.5px; max-height: 30vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .grades .g { display: flex; padding: 1px 0; }
  .grades .g > * + * { margin-left: 8px; }

  .grades .g .no { color: #8E8B84; width: 28px; }
  .grades .g .san { width: 62px; }
  .grades .g .sym { width: 26px; font-weight: 700; }
  .grades .g .loss { margin-left: auto; color: #8E8B84; }
  .legend { border-top: 1px solid #E4E0D8; padding-top: 6px; font-size: 12px; }
  .legend .lg { display: flex; align-items: center; padding: 2px 0; }
  .legend .lg > * + * { margin-left: 8px; }
  .legend .lg .sym { width: 30px; font-weight: 700; }
  .legend .lg .en { width: 88px; }
  .legend .lg .cn { color: #8E8B84; width: 52px; }
  .legend .lg .th { margin-left: auto; color: #8E8B84; font-size: 11px; }
  /* 表头行（与数据行同列宽，方便对齐；与桌面端的表头一致） */
  .legend .lg-head { color: #8E8B84; font-size: 11.5px; padding-bottom: 3px; }
  .legend .lg-head .sym { font-weight: 400; }

  /* 不开「棋盘在左、面板在右」的两列布局：手机上解析内容一律排在棋盘与走棋记录下方，
     自上而下固定为「走棋记录 → 胜率 → 折线图 → 每手评价 → 符号说明」，横屏整块上下滚动。 */

  /* ---------------- 升变 ---------------- */
  #promo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(246,244,240,.86); display: none;
           align-items: center; justify-content: center; z-index: 20; }
  #promo.on { display: flex; }
  .promo-card { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 16px;
                padding: 14px 16px 16px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .promo-card .t { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .promo-row { display: flex; }
  .promo-row button + button { margin-left: 10px; }
  .promo-row button { width: 58px; height: 58px; border: 1px solid #E4E0D8; background: #FFFFFF;
                      border-radius: 12px; padding: 4px; cursor: pointer; }
  .promo-row button:active { background: #E6EEE9; border-color: #4E7C6A; }
  .promo-row canvas { width: 100%; height: 100%; display: block; }

  /* iOS / 全面屏安全区：先给普通值，再用 env() 覆盖（老浏览器忽略第二条，不会出错） */
  .topbar { padding-top: 8px; padding-top: calc(8px + env(safe-area-inset-top)); }
  .side { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .diff-scroll { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .home-btns { margin-bottom: 0; }

  /* iOS Safari 的"添加到主屏幕"提示（只在未以独立 App 方式运行时出现） */
  .ios-hint { display: none; position: fixed; left: 12px; right: 12px; bottom: 10px;
              padding: 9px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E0D8;
              color: #8E8B84; font-size: 12px; line-height: 1.45; text-align: center; }
  .ios-hint b { color: #3C6253; }
  .ios-hint.on { display: block; }
  /* ---------------- 定式学习 ---------------- */
  .op-list { display: block; }
  .op-row { display: flex; align-items: center; background: #FFFFFF; border: 1px solid #E4E0D8;
            border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .op-row:active { background: #E6EEE9; border-color: #4E7C6A; }
  .op-no { width: 34px; flex: 0 0 34px; font-size: 17px; font-weight: 700; color: #3C6253; text-align: center; }
  .op-main { flex: 1 1 auto; min-width: 0; }
  .op-name { font-size: 16px; font-weight: 700; }
  .op-side { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 400;
             color: #3C6253; background: #E6EEE9; border-radius: 6px; padding: 1px 6px; }
  .op-sub { font-size: 12.5px; color: #8E8B84; margin-top: 2px; }
  .op-arrow { color: #8E8B84; font-size: 20px; padding-left: 6px; }

  .study-board-area { display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  canvas#studyBoard { display: block; border-radius: 6px; max-width: 100%; touch-action: manipulation; }
  .study-card { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px; }
  .study-summary { font-size: 13px; color: #8E8B84; line-height: 1.5; }
  .study-panel { margin-top: 8px; }
  .sp-headline { font-size: 14px; font-weight: 700; color: #2C2C2A; line-height: 1.5; }
  .sp-flash { font-size: 14px; font-weight: 700; color: #C25B4E; line-height: 1.5; }
  .sp-row { display: flex; margin-top: 8px; }
  .sp-tag { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
            height: 20px; line-height: 16px; margin-right: 8px; }
  .sp-tag.opp { color: #3C6253; background: #E6EEE9; }
  .sp-tag.me { color: #8E8B84; background: #F1ECE2; }
  .sp-body { flex: 1 1 auto; min-width: 0; font-size: 14px; }
  .sp-body b { font-size: 14px; }
  .sp-txt { font-size: 13px; color: #2C2C2A; line-height: 1.5; margin-top: 2px; }
  .sp-why { margin-top: 10px; border-top: 1px solid #E4E0D8; padding-top: 8px; }
  .sp-head { font-size: 13px; font-weight: 700; }
  .sp-item { margin-top: 6px; font-size: 13.5px; }
  .sp-item b { color: #3C6253; }
  .sp-prompt { font-size: 12.5px; color: #8E8B84; line-height: 1.5; margin-top: 8px; }
  .study-var { font-size: 13px; color: #3C6253; margin-top: 6px; }
  .study-moves { font-size: 13.5px; color: #2C2C2A; margin-top: 8px; white-space: pre-wrap;
                 line-height: 1.6; }
  .study-actions { margin-top: 10px; }
  .study-guide { display: none; margin-top: 10px; border-top: 1px solid #E4E0D8; padding-top: 8px; }
  .study-guide.on { display: block; }
  .study-guide .g-level { font-size: 13.5px; font-weight: 700; color: #3C6253; }
  .study-guide .g-sec { font-size: 13px; font-weight: 700; margin: 8px 0 4px; }
  .study-guide .g-list { margin: 0; padding-left: 18px; font-size: 13px; color: #2C2C2A; line-height: 1.55; }
  .study-guide .g-list li { margin-bottom: 3px; }
  /* ---------------- 电脑宽屏：左记录 · 中棋盘 · 右 AI 解析 ---------------- */
  /* 竖屏/手机不受影响（这些规则只在宽屏横屏下生效） */
  @media (min-width: 1080px) and (orientation: landscape) {
    #screen-game .game-body,
    #screen-study .game-body,
    #screen-review .game-body {
      display: grid;
      gap: 14px;
      align-items: start;
      overflow: hidden;
      padding: 6px 14px 12px;
    }
    #screen-game .game-body { grid-template-columns: 272px minmax(0, 1fr) 344px; }
    #screen-study .game-body { grid-template-columns: minmax(0, 1fr) 344px; }

    #screen-game .board-area { grid-column: 2; grid-row: 1; padding: 0; }
    #screen-study .board-area { grid-column: 1; grid-row: 1; padding: 0; }

    /* .side 只是容器：让它的两块直接参与栅格 */
    #screen-game .side { display: contents; }
    #screen-game .side-left {
      grid-column: 1; grid-row: 1;
      height: 100%; overflow-y: auto;
      padding: 0; display: flex; flex-direction: column; gap: 10px;
    }
    #screen-game .side-right {
      grid-column: 3; grid-row: 1;
      height: 100%; overflow-y: auto; padding: 0;
    }
    #screen-study .side {
      grid-column: 2; grid-row: 1; padding: 0;
      height: 100%; overflow-y: auto;
    }
    #screen-game .actions { display: flex; flex-direction: column; gap: 8px; }
    #screen-game .actions .btn { width: 100%; }
    #screen-game .moves { flex: 1 1 auto; min-height: 0; max-height: none; overflow-y: auto; }
    #screen-game .analysis { margin-top: 0; }
  }
  /* ---------------- 复盘 ---------------- */
  .btn.primary { background: #3C6253; color: #FFFFFF; border-color: #3C6253; }
  .game-body > .side > .review-card {
    background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
  }
  /* 窄屏（手机竖屏）：卡片高度固定，文本在框内滚动，不会越拉越长 */
  @media (max-width: 1079px) {
    .game-body > .side > .review-card { height: 46vh; max-height: none; }
    .review-log { max-height: none; }
  }
  .review-log {
    flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 14px; line-height: 1.62; color: #2C2C2A; white-space: pre-wrap;
  }
  .review-log .ln { margin: 0 0 8px; }
  .review-log .ln.last { font-weight: 700; color: #3C6253; }
  .review-log .ln.hint { color: #8E8B84; }
  .review-actions { margin-top: 8px; display: flex; gap: 8px; }
  .rv-strip { background: #E6EEE9; border-radius: 9px; padding: 6px 10px; margin-bottom: 8px;
              font-size: 13px; color: #3C6253; display: flex; justify-content: space-between; gap: 8px; }
  .rv-strip b { font-weight: 700; }
  .review-actions .btn { flex: 1 1 0; }
  canvas#reviewBoard { display: block; border-radius: 6px; max-width: 100%; touch-action: manipulation; }
  @media (min-width: 1080px) and (orientation: landscape) {
    #screen-review .game-body { grid-template-columns: minmax(0, 1fr) 420px; }
    #screen-review .board-area { grid-column: 1; grid-row: 1; padding: 0; }
    #screen-review .side { grid-column: 2; grid-row: 1; padding: 0; height: 100%; overflow: hidden; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 主页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="logo" id="logo"></div>
    <div class="title">国际象棋</div>
    <div class="divider"></div>
    <div class="subtitle">简约 · 人机对战 · 本地双人</div>
    <div class="home-btns">
      <button class="btn primary" id="btnAiPlay">人机对战</button>
      <button class="btn" id="btnPvpPlay">人人对战（本地）</button>
      <button class="btn" id="btnStudy">定式学习</button>
    </div>
    <div class="foot">ELO 100 – 2000 · 共 20 档难度</div>
    <!-- 仅 iOS Safari（未添加到主屏幕时）显示的一次性提示 -->
    <div class="ios-hint" id="iosHint">想全屏玩？点下方 <b>分享</b> → <b>添加到主屏幕</b>，就会生成一个「国际象棋」图标</div>
  </section>

  <!-- ============ 难度 ============ -->
  <section id="screen-difficulty" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnDiffBack">← 返回</button>
      <div class="spacer"></div>
    </div>
    <div class="diff-scroll">
      <div class="diff-head">
        <div class="h1">选择难度</div>
        <div class="h2">ELO 等级分 100 – 2000 · 每 100 分一档 · 共 20 档</div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="side-caption">你的执子</div>
      <div class="side-pick" id="sidePick">
        <button class="btn side-btn on" id="sideWhite">执白 · 先行</button>
        <button class="btn side-btn" id="sideBlack">执黑 · 后行</button>
      </div>
      <div class="diff-hint" id="diffHint">点击任意档位开始对局 · 你执白先行</div>
    </div>
  </section>

  <!-- ============ 对局 ============ -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnBack">← 返回</button>
      <div class="titleblock">
        <div class="heading" id="gameTitle">人机对战</div>
        <div class="sub" id="gameSub"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn small" id="btnAnalysis">AI 解析 · 关</button>
    </div>
    <div class="game-body">
      <div class="board-area">
        <div class="board-wrap"><canvas id="board"></canvas></div>
      </div>
      <div class="side">
        <div class="side-left">
          <div class="row">
            <div class="dot white" id="turnDot"></div>
            <div class="turn" id="turnText">白方走棋</div>
            <div class="round" id="roundText">第 1 回合</div>
          </div>
          <div class="status" id="statusText"></div>
          <div class="actions">
            <button class="btn" id="btnUndo">悔棋</button>
            <button class="btn primary" id="btnReview" style="display:none">复盘</button>
            <button class="btn" id="btnNew">新局</button>
            <button class="btn" id="btnControl">控制格 · 关</button>
          </div>
          <div class="moves" id="moves"></div>
        </div>
        <div class="side-right">
        <div class="analysis" id="analysis">
          <!-- 顺序固定为：胜率（图上方一行）→ 胜率折线图 → 每手评价 → 符号说明表 -->
          <div class="an-head">
            <div class="an-title">AI 解析</div>
            <div class="an-note">仅供参考</div>
          </div>
          <div class="an-rate">
            <div class="big" id="anRate">50%</div>
            <div class="lbl">白方胜率</div>
            <div class="eval" id="anEval">+0.00</div>
          </div>
          <div class="an-cap" id="anCap">全局胜率变化</div>
          <canvas id="chart"></canvas>
          <div class="an-cap">每手评价（最新在下方）</div>
          <div class="grades" id="grades"></div>
          <div class="legend" id="legend"></div>
        </div>
        </div>
      </div>
    </div>
  </section>
  <!-- ============ 定式学习：开局列表 ============ -->
  <section id="screen-openings" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnStudyBack">← 返回</button>
      <div class="titleblock">
        <div class="heading">定式学习</div>
        <div class="sub">常用开局与主要变化 · 跟着箭头走，每步都有点评</div>
      </div>
      <div class="spacer"></div>
    </div>
    <div class="diff-scroll">
      <div class="op-list" id="openingList"></div>
    </div>
  </section>

  <!-- ============ 定式学习：学习界面 ============ -->
  <section id="screen-study" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnStudyList">← 列表</button>
      <div class="titleblock">
        <div class="heading" id="studyTitle">定式</div>
        <div class="sub" id="studySub"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn small" id="btnStudyRestart">重来</button>
    </div>
    <div class="game-body">
      <div class="board-area study-board-area">
        <div class="board-wrap study-board-wrap"><canvas id="studyBoard"></canvas></div>
      </div>
      <div class="side">
        <div class="study-card">
          <div class="study-summary" id="studySummary"></div>
          <div class="study-panel" id="studyPanel"></div>
          <div class="study-var" id="studyVariation"></div>
          <div class="study-moves" id="studyMoves"></div>
          <div class="study-actions"><button class="btn small" id="btnStudyGuide">开局讲解</button></div>
          <div class="study-guide" id="studyGuide"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 对局复盘 ============ -->
  <section id="screen-review" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnReviewBack">← 返回</button>
      <div class="titleblock">
        <div class="heading">对局复盘</div>
        <div class="sub" id="rvProgress">正在准备…</div>
      </div>
      <div class="spacer"></div>
    </div>
    <div class="game-body">
      <div class="board-area review-board-area">
        <div class="board-wrap review-board-wrap"><canvas id="reviewBoard"></canvas></div>
      </div>
      <div class="side">
        <div class="review-card">
          <div class="rv-strip" id="rvStrip" style="display:none"></div>
          <div class="actions review-actions">
            <button class="btn small" id="btnReviewControl">控制格 · 关</button>
            <button class="btn small" id="btnReviewAnalysis">AI 解析 · 关</button>
          </div>
          <div class="review-log" id="reviewLog"></div>
          <div class="actions review-actions">
            <button class="btn primary" id="btnReviewContinue">继续 ▶</button>
            <button class="btn" id="btnReviewRestart">重新开始</button>
          </div>
          <div class="actions review-actions">
            <button class="btn" id="btnReviewPrev">◀ 上一步</button>
            <button class="btn" id="btnReviewNext">下一个关键步 ▶</button>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>


<div id="promo">
  <div class="promo-card">
    <div class="t">选择升变棋子</div>
    <div class="promo-row" id="promoRow"></div>
  </div>
</div>

<script src="pieces.js"></script>
<script src="engine.js"></script>
<script src="openings.js"></script>
<script src="review.js"></script>
<script src="ui.js"></script>
<script src="study.js"></script>
</body>
</html>
