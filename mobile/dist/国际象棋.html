<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="国际象棋">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="apple-touch-icon.png">
<title>国际象棋</title>
<style>
  :root {
    --bg: #F6F4F0;
    --surface: #FFFFFF;
    --border: #E4E0D8;
    --text: #2C2C2A;
    --muted: #8E8B84;
    --accent: #4E7C6A;
    --accent-dark: #3C6253;
    --accent-soft: #E6EEE9;
    --light-sq: #F1ECE2;
    --dark-sq: #A7B69D;
    --danger: #C25B4E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #F6F4F0; color: #2C2C2A;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; min-width: 0; }
  .screen.active { display: flex; }

  /* ---------------- 通用 ---------------- */
  .btn {
    border: 1px solid #E4E0D8; background: #FFFFFF; color: #2C2C2A;
    border-radius: 12px; font-size: 16px; padding: 12px 16px; cursor: pointer;
    font-family: inherit; transition: background .12s, border-color .12s;
    white-space: nowrap; flex: 0 0 auto;
  }
  .btn:active { background: #EFEDE7; }
  .btn.primary { background: #4E7C6A; border-color: #4E7C6A; color: #fff; font-size: 17px; }
  .btn.primary:active { background: #3C6253; }
  .btn.ghost { background: transparent; border-color: transparent; color: #8E8B84; }
  .btn.small { font-size: 14px; padding: 8px 12px; border-radius: 10px; }
  .btn.on { background: #4E7C6A; border-color: #4E7C6A; color: #fff; }

  /* ---------------- 主页 ---------------- */
  #screen-home { align-items: center; justify-content: center; padding: 24px; }
  .logo { font-size: 64px; color: #4E7C6A; opacity: .55; line-height: 1; margin-bottom: 4px; }
  .logo svg { width: 84px; height: 84px; display: block; }
  .title { font-size: 34px; font-weight: 700; letter-spacing: 2px; margin: 10px 0 6px; }
  .divider { width: 56px; height: 3px; background: #4E7C6A; border-radius: 2px; margin: 6px 0 10px; }
  .subtitle { color: #8E8B84; font-size: 13px; margin-bottom: 34px; }
  .home-btns { width: 320px; max-width: 86vw; display: block; }
  .home-btns .btn { display: block; width: 100%; margin-bottom: 14px; }
  .home-btns .btn { padding: 16px; }
  .foot { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
          color: #8E8B84; font-size: 12px; }

  /* ---------------- 难度 ---------------- */
  .topbar {
    display: flex; align-items: center;
    padding: 8px 12px;
    background: #F6F4F0;
  }
  .topbar > * + * { margin-left: 8px; }
  .topbar .spacer { flex: 1 1 auto; min-width: 0; }
  .topbar > * { flex: 0 0 auto; }
  .topbar .titleblock { min-width: 0; overflow: hidden; }
  .topbar .heading { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .heading { font-size: 17px; font-weight: 700; }
  .topbar .sub { font-size: 11px; color: #8E8B84; }
  .diff-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 12px 16px; }
  .diff-head { text-align: center; margin: 6px 0 14px; }
  .diff-head .h1 { font-size: 24px; font-weight: 700; }
  .diff-head .h2 { font-size: 12.5px; color: #8E8B84; margin-top: 6px; }
  .tiles { display: block; margin: 0 -5px; }
  .tile { display: inline-block; width: 25%; padding: 0 5px; margin-bottom: 10px;
          vertical-align: top; box-sizing: border-box; }
  .tile .tile-inner { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px;
                      padding: 10px 4px 8px; text-align: center; }
  @media (min-width: 620px) { .tile { width: 20%; } }
  .tile, .tile .tile-inner { cursor: pointer; }
  .tile:active .tile-inner, .tile.hl .tile-inner { background: #E6EEE9; border-color: #4E7C6A; }
  .tile .elo { font-size: 19px; font-weight: 700; }
  .tile .tier { font-size: 11px; color: #8E8B84; margin-top: 3px; }
  .diff-hint { text-align: center; color: #8E8B84; font-size: 12.5px; margin: 16px 0 4px; min-height: 18px; }

  /* 执白 / 执黑 二选一 */
  .side-caption { text-align: center; color: #8E8B84; font-size: 11.5px; margin: 10px 0 6px; }
  .side-pick { display: flex; justify-content: center; margin-bottom: 2px; }
  .side-pick .side-btn { padding: 10px 14px; font-size: 14px; }
  .side-pick .side-btn + .side-btn { margin-left: 10px; }
  .side-pick .side-btn.on { background: #E6EEE9; border-color: #4E7C6A; color: #3C6253; font-weight: 700; }
  /* 开关类按钮的"已开启"状态（与桌面版 Highlighted 一致） */
  .actions .btn.on { background: #E6EEE9; border-color: #4E7C6A; color: #3C6253; font-weight: 700; }

  /* ---------------- 对局 ---------------- */
  .game-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: block; }
  .board-area { display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .board-wrap { position: relative; }
  canvas#board { display: block; touch-action: manipulation; border-radius: 6px; max-width: 100%; }
  .side { padding: 8px 12px 16px; display: block; }
  .side > * { margin-bottom: 8px; }
  .row { display: flex; align-items: center; }
  .row > * + * { margin-left: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(44,44,42,.45); flex: 0 0 auto; }
  .dot.white { background: #fff; }
  .dot.black { background: #33322E; }
  .turn { font-size: 15px; font-weight: 700; }
  .round { margin-left: auto; font-size: 12px; color: #8E8B84; }
  .status { font-size: 12.5px; color: #8E8B84; min-height: 17px; }
  .status.check { color: #C25B4E; font-weight: 700; }
  .actions { display: flex; }
  .actions .btn + .btn { margin-left: 10px; }
  .actions .btn { flex: 1; }
  .moves { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 6px 10px;
           font-size: 13.5px; max-height: 20vh; overflow-y: auto; }
  .moves .empty { color: #8E8B84; text-align: center; padding: 10px 0; font-size: 12.5px; }
  .mv { display: flex; padding: 3px 0; }
  .mv > * + * { margin-left: 6px; }
  .mv.cur { background: #E6EEE9; border-radius: 6px; }
  .mv .no { color: #8E8B84; width: 26px; flex: 0 0 auto; }
  .mv .san { width: 62px; flex: 0 0 auto; }
  .mv .sym { font-weight: 700; }
  .mv .san2 { width: 62px; flex: 0 0 auto; }
  .mv .sym2 { font-weight: 700; }

  /* ---------------- AI 解析 ---------------- */
  .analysis { display: none;
              background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px; }
  .analysis > * + * { margin-top: 8px; }
  .analysis.on { display: block; }
  .an-head { display: flex; align-items: baseline; }
  .an-head > * + * { margin-left: 8px; }
  .an-title { font-size: 13px; font-weight: 700; }
  .an-note { font-size: 11px; color: #8E8B84; margin-left: auto; }
  .an-rate { display: flex; align-items: baseline; justify-content: center; text-align: center; }
  .an-rate > * + * { margin-left: 8px; }
  .an-rate .big { font-size: 28px; font-weight: 700; color: #3C6253; }
  .an-rate .lbl { font-size: 12px; color: #8E8B84; }
  .an-rate .eval { font-size: 14px; font-weight: 700; }
  .an-cap { font-size: 11px; color: #8E8B84; }
  canvas#chart { width: 100%; height: 84px; display: block; }
  .grades { font-size: 12.5px; max-height: 30vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .grades .g { display: flex; padding: 1px 0; }
  .grades .g > * + * { margin-left: 8px; }

  .grades .g .no { color: #8E8B84; width: 28px; }
  .grades .g .san { width: 62px; }
  .grades .g .sym { width: 26px; font-weight: 700; }
  .grades .g .loss { margin-left: auto; color: #8E8B84; }
  .legend { border-top: 1px solid #E4E0D8; padding-top: 6px; font-size: 12px; }
  .legend .lg { display: flex; align-items: center; padding: 2px 0; }
  .legend .lg > * + * { margin-left: 8px; }
  .legend .lg .sym { width: 30px; font-weight: 700; }
  .legend .lg .en { width: 88px; }
  .legend .lg .cn { color: #8E8B84; width: 52px; }
  .legend .lg .th { margin-left: auto; color: #8E8B84; font-size: 11px; }
  /* 表头行（与数据行同列宽，方便对齐；与桌面端的表头一致） */
  .legend .lg-head { color: #8E8B84; font-size: 11.5px; padding-bottom: 3px; }
  .legend .lg-head .sym { font-weight: 400; }

  /* 不开「棋盘在左、面板在右」的两列布局：手机上解析内容一律排在棋盘与走棋记录下方，
     自上而下固定为「走棋记录 → 胜率 → 折线图 → 每手评价 → 符号说明」，横屏整块上下滚动。 */

  /* ---------------- 升变 ---------------- */
  #promo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(246,244,240,.86); display: none;
           align-items: center; justify-content: center; z-index: 20; }
  #promo.on { display: flex; }
  .promo-card { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 16px;
                padding: 14px 16px 16px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .promo-card .t { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .promo-row { display: flex; }
  .promo-row button + button { margin-left: 10px; }
  .promo-row button { width: 58px; height: 58px; border: 1px solid #E4E0D8; background: #FFFFFF;
                      border-radius: 12px; padding: 4px; cursor: pointer; }
  .promo-row button:active { background: #E6EEE9; border-color: #4E7C6A; }
  .promo-row canvas { width: 100%; height: 100%; display: block; }

  /* iOS / 全面屏安全区：先给普通值，再用 env() 覆盖（老浏览器忽略第二条，不会出错） */
  .topbar { padding-top: 8px; padding-top: calc(8px + env(safe-area-inset-top)); }
  .side { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .diff-scroll { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .home-btns { margin-bottom: 0; }

  /* iOS Safari 的"添加到主屏幕"提示（只在未以独立 App 方式运行时出现） */
  .ios-hint { display: none; position: fixed; left: 12px; right: 12px; bottom: 10px;
              padding: 9px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4E0D8;
              color: #8E8B84; font-size: 12px; line-height: 1.45; text-align: center; }
  .ios-hint b { color: #3C6253; }
  .ios-hint.on { display: block; }
  /* ---------------- 定式学习 ---------------- */
  .op-list { display: block; }
  .op-row { display: flex; align-items: center; background: #FFFFFF; border: 1px solid #E4E0D8;
            border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .op-row:active { background: #E6EEE9; border-color: #4E7C6A; }
  .op-no { width: 34px; flex: 0 0 34px; font-size: 17px; font-weight: 700; color: #3C6253; text-align: center; }
  .op-main { flex: 1 1 auto; min-width: 0; }
  .op-name { font-size: 16px; font-weight: 700; }
  .op-side { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 400;
             color: #3C6253; background: #E6EEE9; border-radius: 6px; padding: 1px 6px; }
  .op-sub { font-size: 12.5px; color: #8E8B84; margin-top: 2px; }
  .op-arrow { color: #8E8B84; font-size: 20px; padding-left: 6px; }

  .study-board-area { display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  canvas#studyBoard { display: block; border-radius: 6px; max-width: 100%; touch-action: manipulation; }
  .study-card { background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px; }
  .study-summary { font-size: 13px; color: #8E8B84; line-height: 1.5; }
  .study-panel { margin-top: 8px; }
  .sp-headline { font-size: 14px; font-weight: 700; color: #2C2C2A; line-height: 1.5; }
  .sp-flash { font-size: 14px; font-weight: 700; color: #C25B4E; line-height: 1.5; }
  .sp-row { display: flex; margin-top: 8px; }
  .sp-tag { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
            height: 20px; line-height: 16px; margin-right: 8px; }
  .sp-tag.opp { color: #3C6253; background: #E6EEE9; }
  .sp-tag.me { color: #8E8B84; background: #F1ECE2; }
  .sp-body { flex: 1 1 auto; min-width: 0; font-size: 14px; }
  .sp-body b { font-size: 14px; }
  .sp-txt { font-size: 13px; color: #2C2C2A; line-height: 1.5; margin-top: 2px; }
  .sp-why { margin-top: 10px; border-top: 1px solid #E4E0D8; padding-top: 8px; }
  .sp-head { font-size: 13px; font-weight: 700; }
  .sp-item { margin-top: 6px; font-size: 13.5px; }
  .sp-item b { color: #3C6253; }
  .sp-prompt { font-size: 12.5px; color: #8E8B84; line-height: 1.5; margin-top: 8px; }
  .study-var { font-size: 13px; color: #3C6253; margin-top: 6px; }
  .study-moves { font-size: 13.5px; color: #2C2C2A; margin-top: 8px; white-space: pre-wrap;
                 line-height: 1.6; }
  .study-actions { margin-top: 10px; }
  .study-guide { display: none; margin-top: 10px; border-top: 1px solid #E4E0D8; padding-top: 8px; }
  .study-guide.on { display: block; }
  .study-guide .g-level { font-size: 13.5px; font-weight: 700; color: #3C6253; }
  .study-guide .g-sec { font-size: 13px; font-weight: 700; margin: 8px 0 4px; }
  .study-guide .g-list { margin: 0; padding-left: 18px; font-size: 13px; color: #2C2C2A; line-height: 1.55; }
  .study-guide .g-list li { margin-bottom: 3px; }
  /* ---------------- 电脑宽屏：左记录 · 中棋盘 · 右 AI 解析 ---------------- */
  /* 竖屏/手机不受影响（这些规则只在宽屏横屏下生效） */
  @media (min-width: 1080px) and (orientation: landscape) {
    #screen-game .game-body,
    #screen-study .game-body,
    #screen-review .game-body {
      display: grid;
      gap: 14px;
      align-items: start;
      overflow: hidden;
      padding: 6px 14px 12px;
    }
    #screen-game .game-body { grid-template-columns: 272px minmax(0, 1fr) 344px; }
    #screen-study .game-body { grid-template-columns: minmax(0, 1fr) 344px; }

    #screen-game .board-area { grid-column: 2; grid-row: 1; padding: 0; }
    #screen-study .board-area { grid-column: 1; grid-row: 1; padding: 0; }

    /* .side 只是容器：让它的两块直接参与栅格 */
    #screen-game .side { display: contents; }
    #screen-game .side-left {
      grid-column: 1; grid-row: 1;
      height: 100%; overflow-y: auto;
      padding: 0; display: flex; flex-direction: column; gap: 10px;
    }
    #screen-game .side-right {
      grid-column: 3; grid-row: 1;
      height: 100%; overflow-y: auto; padding: 0;
    }
    #screen-study .side {
      grid-column: 2; grid-row: 1; padding: 0;
      height: 100%; overflow-y: auto;
    }
    #screen-game .actions { display: flex; flex-direction: column; gap: 8px; }
    #screen-game .actions .btn { width: 100%; }
    #screen-game .moves { flex: 1 1 auto; min-height: 0; max-height: none; overflow-y: auto; }
    #screen-game .analysis { margin-top: 0; }
  }
  /* ---------------- 复盘 ---------------- */
  .btn.primary { background: #3C6253; color: #FFFFFF; border-color: #3C6253; }
  .game-body > .side > .review-card {
    background: #FFFFFF; border: 1px solid #E4E0D8; border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
  }
  /* 窄屏（手机竖屏）：卡片高度固定，文本在框内滚动，不会越拉越长 */
  @media (max-width: 1079px) {
    .game-body > .side > .review-card { height: 46vh; max-height: none; }
    .review-log { max-height: none; }
  }
  .review-log {
    flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    font-size: 14px; line-height: 1.62; color: #2C2C2A; white-space: pre-wrap;
  }
  .review-log .ln { margin: 0 0 8px; }
  .review-log .ln.last { font-weight: 700; color: #3C6253; }
  .review-log .ln.hint { color: #8E8B84; }
  .review-actions { margin-top: 8px; display: flex; gap: 8px; }
  .rv-strip { background: #E6EEE9; border-radius: 9px; padding: 6px 10px; margin-bottom: 8px;
              font-size: 13px; color: #3C6253; display: flex; justify-content: space-between; gap: 8px; }
  .rv-strip b { font-weight: 700; }
  .review-actions .btn { flex: 1 1 0; }
  canvas#reviewBoard { display: block; border-radius: 6px; max-width: 100%; touch-action: manipulation; }
  @media (min-width: 1080px) and (orientation: landscape) {
    #screen-review .game-body { grid-template-columns: minmax(0, 1fr) 420px; }
    #screen-review .board-area { grid-column: 1; grid-row: 1; padding: 0; }
    #screen-review .side { grid-column: 2; grid-row: 1; padding: 0; height: 100%; overflow: hidden; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 主页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="logo" id="logo"></div>
    <div class="title">国际象棋</div>
    <div class="divider"></div>
    <div class="subtitle">简约 · 人机对战 · 本地双人</div>
    <div class="home-btns">
      <button class="btn primary" id="btnAiPlay">人机对战</button>
      <button class="btn" id="btnPvpPlay">人人对战（本地）</button>
      <button class="btn" id="btnStudy">定式学习</button>
    </div>
    <div class="foot">ELO 100 – 2000 · 共 20 档难度</div>
    <!-- 仅 iOS Safari（未添加到主屏幕时）显示的一次性提示 -->
    <div class="ios-hint" id="iosHint">想全屏玩？点下方 <b>分享</b> → <b>添加到主屏幕</b>，就会生成一个「国际象棋」图标</div>
  </section>

  <!-- ============ 难度 ============ -->
  <section id="screen-difficulty" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnDiffBack">← 返回</button>
      <div class="spacer"></div>
    </div>
    <div class="diff-scroll">
      <div class="diff-head">
        <div class="h1">选择难度</div>
        <div class="h2">ELO 等级分 100 – 2000 · 每 100 分一档 · 共 20 档</div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="side-caption">你的执子</div>
      <div class="side-pick" id="sidePick">
        <button class="btn side-btn on" id="sideWhite">执白 · 先行</button>
        <button class="btn side-btn" id="sideBlack">执黑 · 后行</button>
      </div>
      <div class="diff-hint" id="diffHint">点击任意档位开始对局 · 你执白先行</div>
    </div>
  </section>

  <!-- ============ 对局 ============ -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <button class="btn small ghost" id="btnBack">← 返回</button>
      <div class="titleblock">
        <div class="heading" id="gameTitle">人机对战</div>
        <div class="sub" id="gameSub"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn small" id="btnAnalysis">AI 解析 · 关</button>
    </div>
    <div class="game-body">
      <div class="board-area">
        <div class="board-wrap"><canvas id="board"></canvas></div>
      </div>
      <div class="side">
        <div class="side-left">
          <div class="row">
            <div class="dot white" id="turnDot"></div>
            <div class="turn" id="turnText">白方走棋</div>
            <div class="round" id="roundText">第 1 回合</div>
          </div>
          <div class="status" id="statusText"></div>
          <div class="actions">
            <button class="btn" id="btnUndo">悔棋</button>
            <button class="btn primary" id="btnReview" style="display:none">复盘</button>
            <button class="btn" id="btnNew">新局</button>

        if (phase > 24) phase = 24;
        if (phase < 0) phase = 0;
        return ((mid * phase + end * (24 - phase)) / 24) | 0;
    }

    // ------------------------------------------------------------------
    // 局面
    // ------------------------------------------------------------------
    function Board() {
        this.sq = new Int8Array(128);
        this.matPst = new Int32Array(3);
        this.kingSq = new Int32Array(3);
        this.pieceCount = new Int32Array(24);
        this.pawnFile = new Int32Array(24);
        this.undoStack = new Int32Array(10 * 1024);
        this.nullStack = new Int32Array(4 * 128);
        this.clear();
    }

    Board.prototype.clear = function () {
        this.sq.fill(0);
        this.matPst.fill(0);
        this.kingSq.fill(0);
        this.pieceCount.fill(0);
        this.pawnFile.fill(0);
        this.phase = 0;
        this.side = WHITE;
        this.castling = 0;
        this.ep = -1;
        this.halfmove = 0;
        this.fullmove = 1;
        this.keyLo = 0; this.keyHi = 0;
        this.stackTop = 0;
        this.nullTop = 0;
    };

    Board.prototype.clone = function () {
        var b = Object.create(Board.prototype);
        b.sq = new Int8Array(this.sq);
        b.matPst = new Int32Array(this.matPst);
        b.kingSq = new Int32Array(this.kingSq);
        b.pieceCount = new Int32Array(this.pieceCount);
        b.pawnFile = new Int32Array(this.pawnFile);
        b.undoStack = new Int32Array(10 * 1024);
        b.nullStack = new Int32Array(4 * 128);
        b.phase = this.phase;
        b.side = this.side;
        b.castling = this.castling;
        b.ep = this.ep;
        b.halfmove = this.halfmove;
        b.fullmove = this.fullmove;
        b.keyLo = this.keyLo; b.keyHi = this.keyHi;
        b.stackTop = 0;
        b.nullTop = 0;
        return b;
    };

    Board.prototype.addPiece = function (s, p) {
        this.sq[s] = p;
        var i = s * 24 + p;
        this.keyLo ^= ZP_LO[i]; this.keyHi ^= ZP_HI[i];
        var t = typeOf(p), c = colorOf(p);
        this.pieceCount[p]++;
        if (t === PT.King) {
            this.kingSq[c] = s;
        } else {
            this.matPst[c] += PIECE_VALUE[t] + pstValue(t, s, c);
            if (t === PT.Knight || t === PT.Bishop) this.phase += 1;
            else if (t === PT.Rook) this.phase += 2;
            else if (t === PT.Queen) this.phase += 4;
        }
        if (t === PT.Pawn) this.pawnFile[(c << 3) | fileOf(s)]++;
    };

    Board.prototype.removePiece = function (s) {
        var p = this.sq[s];
        if (p === 0) return;
        var i = s * 24 + p;
        this.keyLo ^= ZP_LO[i]; this.keyHi ^= ZP_HI[i];
        var t = typeOf(p), c = colorOf(p);
        this.pieceCount[p]--;
        if (t === PT.King) {
            this.kingSq[c] = 0;
        } else {
            this.matPst[c] -= PIECE_VALUE[t] + pstValue(t, s, c);
            if (t === PT.Knight || t === PT.Bishop) this.phase -= 1;
            else if (t === PT.Rook) this.phase -= 2;
            else if (t === PT.Queen) this.phase -= 4;
        }
        if (t === PT.Pawn) this.pawnFile[(c << 3) | fileOf(s)]--;
        this.sq[s] = 0;
    };

    Board.prototype.movePiece = function (from, to) {
        var p = this.sq[from];
        this.removePiece(from);
        this.addPiece(to, p);
    };

    Board.prototype.recomputeKey = function () {
        var lo = 0, hi = 0;
        for (var i = 0; i < 128; i++) {
            if ((i & 0x88) !== 0) continue;
            var p = this.sq[i];
            if (p === 0) continue;
            lo ^= ZP_LO[i * 24 + p]; hi ^= ZP_HI[i * 24 + p];
        }
        lo ^= ZC_LO[this.castling]; hi ^= ZC_HI[this.castling];
        if (this.ep >= 0) { lo ^= ZE_LO[this.ep]; hi ^= ZE_HI[this.ep]; }
        if (this.side === BLACK) { lo ^= ZS_LO; hi ^= ZS_HI; }
        return { lo: lo | 0, hi: hi | 0 };
    };

    Board.prototype.recomputeIncremental = function () {
        this.matPst.fill(0); this.kingSq.fill(0);
        this.pieceCount.fill(0); this.pawnFile.fill(0);
        this.phase = 0;
        for (var i = 0; i < 128; i++) {
            if ((i & 0x88) !== 0) continue;
            var p = this.sq[i];
            if (p === 0) continue;
            var t = typeOf(p), c = colorOf(p);
            this.pieceCount[p]++;
            if (t === PT.King) this.kingSq[c] = i;
            else {
                this.matPst[c] += PIECE_VALUE[t] + pstValue(t, i, c);
                if (t === PT.Knight || t === PT.Bishop) this.phase += 1;
                else if (t === PT.Rook) this.phase += 2;
                else if (t === PT.Queen) this.phase += 4;
            }
            if (t === PT.Pawn) this.pawnFile[(c << 3) | fileOf(i)]++;
        }
    };

    Board.prototype.loadFen = function (fen) {
        this.clear();
        var parts = fen.trim().split(/\s+/);
        var rows = parts[0], rank = 7, file = 0;
        for (var i = 0; i < rows.length; i++) {
            var ch = rows[i];
            if (ch === '/') { rank--; file = 0; continue; }
            if (ch >= '1' && ch <= '8') { file += ch.charCodeAt(0) - 48; continue; }
            var t = PT.None;
            switch (ch.toLowerCase()) {
                case 'p': t = PT.Pawn; break;
                case 'n': t = PT.Knight; break;
                case 'b': t = PT.Bishop; break;
                case 'r': t = PT.Rook; break;
                case 'q': t = PT.Queen; break;
                case 'k': t = PT.King; break;
            }
            var c = (ch === ch.toUpperCase()) ? WHITE : BLACK;
            if (t !== PT.None && rank >= 0 && rank < 8 && file >= 0 && file < 8) {
                this.addPiece(sqIndex(file, rank), mkPiece(t, c));
            }
            file++;
        }
        this.side = (parts.length > 1 && parts[1] === 'b') ? BLACK : WHITE;
        this.castling = 0;
        if (parts.length > 2) {
            var cs = parts[2];
            if (cs.indexOf('K') >= 0) this.castling |= CR.WK;
            if (cs.indexOf('Q') >= 0) this.castling |= CR.WQ;
            if (cs.indexOf('k') >= 0) this.castling |= CR.BK;
            if (cs.indexOf('q') >= 0) this.castling |= CR.BQ;
        }
        this.ep = (parts.length > 3 && parts[3] !== '-') ? parseSq(parts[3]) : -1;
        this.halfmove = (parts.length > 4) ? (parseInt(parts[4], 10) || 0) : 0;
        this.fullmove = (parts.length > 5) ? (parseInt(parts[5], 10) || 1) : 1;
        var k = this.recomputeKey();
        this.keyLo = k.lo; this.keyHi = k.hi;
        return this;
    };

    Board.prototype.toFen = function () {
        var out = '';
        for (var rank = 7; rank >= 0; rank--) {
            var empty = 0;
            for (var file = 0; file < 8; file++) {
                var p = this.sq[sqIndex(file, rank)];
                if (p === 0) { empty++; continue; }
                if (empty > 0) { out += empty; empty = 0; }
                var letter = '?';
                switch (typeOf(p)) {
                    case PT.Pawn: letter = 'p'; break;
                    case PT.Knight: letter = 'n'; break;
                    case PT.Bishop: letter = 'b'; break;
                    case PT.Rook: letter = 'r'; break;
                    case PT.Queen: letter = 'q'; break;
                    case PT.King: letter = 'k'; break;
                }
                out += colorOf(p) === WHITE ? letter.toUpperCase() : letter;
            }
            if (empty > 0) out += empty;
            if (rank > 0) out += '/';
        }
        out += this.side === WHITE ? ' w ' : ' b ';
        var cs = '';
        if (this.castling & CR.WK) cs += 'K';
        if (this.castling & CR.WQ) cs += 'Q';
        if (this.castling & CR.BK) cs += 'k';
        if (this.castling & CR.BQ) cs += 'q';
        out += (cs === '' ? '-' : cs);
        out += ' ' + (this.ep >= 0 ? sqName(this.ep) : '-');
        out += ' ' + this.halfmove + ' ' + this.fullmove;
        return out;
    };

    Board.prototype.isSquareAttacked = function (s, byColor) {
        var i, t, p, dir;
        if (byColor === WHITE) {
            if (onBoard(s - 15) && this.sq[s - 15] === mkPiece(PT.Pawn, WHITE)) return true;
            if (onBoard(s - 17) && this.sq[s - 17] === mkPiece(PT.Pawn, WHITE)) return true;
        } else {
            if (onBoard(s + 15) && this.sq[s + 15] === mkPiece(PT.Pawn, BLACK)) return true;
            if (onBoard(s + 17) && this.sq[s + 17] === mkPiece(PT.Pawn, BLACK)) return true;
        }
        var kn = mkPiece(PT.Knight, byColor);
        for (i = 0; i < 8; i++) {
            t = s + KNIGHT_OFF[i];
            if (onBoard(t) && this.sq[t] === kn) return true;
        }
        var kg = mkPiece(PT.King, byColor);
        for (i = 0; i < 8; i++) {
            t = s + KING_OFF[i];
            if (onBoard(t) && this.sq[t] === kg) return true;
        }
        for (i = 0; i < 4; i++) {
            dir = BISHOP_OFF[i];
            t = s + dir;
            while (onBoard(t)) {
                p = this.sq[t];
                if (p !== 0) {
                    if (colorOf(p) === byColor && (typeOf(p) === PT.Bishop || typeOf(p) === PT.Queen)) return true;
                    break;
                }
                t += dir;
            }
        }
        for (i = 0; i < 4; i++) {
            dir = ROOK_OFF[i];
            t = s + dir;
            while (onBoard(t)) {
                p = this.sq[t];
                if (p !== 0) {
                    if (colorOf(p) === byColor && (typeOf(p) === PT.Rook || typeOf(p) === PT.Queen)) return true;
                    break;
                }
                t += dir;
            }
        }
        return false;
    };

    Board.prototype.inCheck = function (color) {
        if (color === undefined) color = this.side;
        var k = this.kingSq[color];
        if (k === 0 && this.sq[0] !== mkPiece(PT.King, color)) return false;
        return this.isSquareAttacked(k, opp(color));
    };

    /**
     * 某一方"控制"（攻击范围）的全部格子。用两个 32 位整数拼成 64 位掩码：
     * 位序 = rank * 8 + file（低位在前），第 0 位是 a1 —— 与桌面版完全一致。
     * 用 lo/hi 两个数是为了避免 JS 位运算只有 32 位的问题。
     */
    Board.prototype.controlledSquares = function (byColor) {
        var lo = 0, hi = 0;
        for (var r = 0; r < 8; r++) {
            for (var f = 0; f < 8; f++) {
                if (!this.isSquareAttacked(sqIndex(f, r), byColor)) continue;
                var bit = r * 8 + f;
                if (bit < 32) lo = (lo | (1 << bit)) >>> 0;
                else hi = (hi | (1 << (bit - 32))) >>> 0;
            }
        }
        return { lo: lo, hi: hi };
    };

    /** 控制格掩码里的某一位（rank * 8 + file）是否置位。 */
    function controlHas(mask, file, rank) {
        var bit = rank * 8 + file;
        if (bit < 32) return (mask.lo & (1 << bit)) !== 0;
        return (mask.hi & (1 << (bit - 32))) !== 0;
    }

    Board.prototype.addPawnMove = function (out, n, from, to, promoRank, flags) {
        if (rankOf(to) === promoRank) {
            out[n++] = MV(from, to, PT.Queen, flags);
            out[n++] = MV(from, to, PT.Rook, flags);
            out[n++] = MV(from, to, PT.Bishop, flags);
            out[n++] = MV(from, to, PT.Knight, flags);
        } else {
            out[n++] = MV(from, to, 0, flags);
        }
        return n;
    };

    /** 生成伪合法走法，写入 out，返回个数 */
    Board.prototype.generateMoves = function (out, capturesOnly) {
        var us = this.side, them = opp(us), n = 0;
        for (var s = 0; s < 128; s++) {
            if ((s & 0x88) !== 0) continue;
            var piece = this.sq[s];
            if (piece === 0 || colorOf(piece) !== us) continue;
            var t = typeOf(piece), i, to, target, dir, d;
            switch (t) {
                case PT.Pawn:
                    dir = us === WHITE ? 16 : -16;
                    var startRank = us === WHITE ? 1 : 6;
                    var promoRank = us === WHITE ? 7 : 0;
                    to = s + dir;
                    if (!capturesOnly && onBoard(to) && this.sq[to] === 0) {
                        n = this.addPawnMove(out, n, s, to, promoRank, MF.None);
                        if (rankOf(s) === startRank) {
                            var to2 = to + dir;
                            if (onBoard(to2) && this.sq[to2] === 0) out[n++] = MV(s, to2, 0, MF.DoublePush);
                        }
                    }
                    for (d = -1; d <= 1; d += 2) {
                        to = s + dir + d;
                        if (!onBoard(to)) continue;
                        target = this.sq[to];
                        if (target !== 0) {
                            if (colorOf(target) === them) n = this.addPawnMove(out, n, s, to, promoRank, MF.None);
                        } else if (to === this.ep) {
                            out[n++] = MV(s, to, 0, MF.EnPassant);
                        }
                    }
                    break;
                case PT.Knight:
                    for (i = 0; i < 8; i++) {
                        to = s + KNIGHT_OFF[i];
                        if (!onBoard(to)) continue;
                        target = this.sq[to];
                        if (target !== 0 && colorOf(target) === us) continue;
                        if (capturesOnly && target === 0) continue;
                        out[n++] = MV(s, to, 0, MF.None);
                    }
                    break;
                case PT.Bishop:
                case PT.Rook:
                case PT.Queen:
                    var offs = t === PT.Bishop ? BISHOP_OFF : (t === PT.Rook ? ROOK_OFF : KING_OFF);
                    var cnt = t === PT.Queen ? 8 : 4;
                    for (i = 0; i < cnt; i++) {
                        dir = offs[i];
                        to = s + dir;
                        while (onBoard(to)) {
                            target = this.sq[to];
                            if (target === 0) {
                                if (!capturesOnly) out[n++] = MV(s, to, 0, MF.None);
                            } else {
                                if (colorOf(target) === them) out[n++] = MV(s, to, 0, MF.None);
                                break;
                            }
                            to += dir;
                        }
                    }
                    break;
                case PT.King:
                    for (i = 0; i < 8; i++) {
                        to = s + KING_OFF[i];
                        if (!onBoard(to)) continue;
                        target = this.sq[to];
                        if (target !== 0 && colorOf(target) === us) continue;
                        if (capturesOnly && target === 0) continue;
                        out[n++] = MV(s, to, 0, MF.None);
                    }
                    if (!capturesOnly) n = this.generateCastles(out, n, us);
                    break;
            }
        }
        return n;
    };

    Board.prototype.generateCastles = function (out, n, us) {
        var E1 = sqIndex(4, 0), H1 = sqIndex(7, 0), A1 = sqIndex(0, 0);
        var E8 = sqIndex(4, 7), H8 = sqIndex(7, 7), A8 = sqIndex(0, 7);
        if (us === WHITE) {
            if ((this.castling & CR.WK) && this.sq[E1] === mkPiece(PT.King, WHITE) && this.sq[H1] === mkPiece(PT.Rook, WHITE) &&
                this.sq[5] === 0 && this.sq[6] === 0 &&
                !this.isSquareAttacked(E1, BLACK) && !this.isSquareAttacked(5, BLACK)) {
                out[n++] = MV(E1, 6, 0, MF.Castle);
            }
            if ((this.castling & CR.WQ) && this.sq[E1] === mkPiece(PT.King, WHITE) && this.sq[A1] === mkPiece(PT.Rook, WHITE) &&
                this.sq[1] === 0 && this.sq[2] === 0 && this.sq[3] === 0 &&
                !this.isSquareAttacked(E1, BLACK) && !this.isSquareAttacked(3, BLACK)) {
                out[n++] = MV(E1, 2, 0, MF.Castle);
            }
        } else {
            if ((this.castling & CR.BK) && this.sq[E8] === mkPiece(PT.King, BLACK) && this.sq[H8] === mkPiece(PT.Rook, BLACK) &&
                this.sq[117] === 0 && this.sq[118] === 0 &&
                !this.isSquareAttacked(E8, WHITE) && !this.isSquareAttacked(117, WHITE)) {
                out[n++] = MV(E8, 118, 0, MF.Castle);
            }
            if ((this.castling & CR.BQ) && this.sq[E8] === mkPiece(PT.King, BLACK) && this.sq[A8] === mkPiece(PT.Rook, BLACK) &&
                this.sq[113] === 0 && this.sq[114] === 0 && this.sq[115] === 0 &&
                !this.isSquareAttacked(E8, WHITE) && !this.isSquareAttacked(115, WHITE)) {
                out[n++] = MV(E8, 114, 0, MF.Castle);
            }
        }
        return n;
    };

    Board.prototype.generateLegalMoves = function () {
        var buf = new Int32Array(256);
        var n = this.generateMoves(buf, false);
        var legal = [];
        for (var i = 0; i < n; i++) {
            if (this.tryMake(buf[i])) {
                legal.push(buf[i]);
                this.unmakeMove();
            }
        }
        return legal;
    };

    Board.prototype.hasLegalMove = function () {
        var buf = new Int32Array(256);
        var n = this.generateMoves(buf, false);
        for (var i = 0; i < n; i++) {
            if (this.tryMake(buf[i])) {
                this.unmakeMove();
                return true;
            }
        }
        return false;
    };

    Board.prototype.makeMove = function (m) {
        var top = this.stackTop * 10, u = this.undoStack;
        var from = mvFrom(m), to = mvTo(m), promo = mvPromo(m), flags = mvFlags(m);
        var piece = this.sq[from], t = typeOf(piece), c = colorOf(piece);
        var captured = 0, capturedSq = -1;

        u[top + 0] = m;
        u[top + 1] = 0;
        u[top + 2] = -1;
        u[top + 3] = this.castling;
        u[top + 4] = this.ep;
        u[top + 5] = this.halfmove;
        u[top + 6] = this.fullmove;
        u[top + 7] = this.keyLo;
        u[top + 8] = this.keyHi;
        this.stackTop++;

        if (flags & MF.EnPassant) {
            capturedSq = to + (c === WHITE ? -16 : 16);
            captured = this.sq[capturedSq];
            this.removePiece(capturedSq);
        } else if (this.sq[to] !== 0) {
            capturedSq = to;
            captured = this.sq[to];
            this.removePiece(to);
        }
        u[top + 1] = captured;
        u[top + 2] = capturedSq;

        this.movePiece(from, to);
        if (promo !== 0) {
            this.removePiece(to);
            this.addPiece(to, mkPiece(promo, c));
        }

        if (flags & MF.Castle) {
            var rf, rt;
            if (to === 6) { rf = sqIndex(7, 0); rt = sqIndex(5, 0); }
            else if (to === 2) { rf = sqIndex(0, 0); rt = sqIndex(3, 0); }
            else if (to === 118) { rf = sqIndex(7, 7); rt = sqIndex(5, 7); }
            else { rf = sqIndex(0, 7); rt = sqIndex(3, 7); }
            this.movePiece(rf, rt);
        }

        var nc = this.castling;
        if (t === PT.King) {
            nc &= (c === WHITE) ? ~(CR.WK | CR.WQ) : ~(CR.BK | CR.BQ);
        }
        if (from === sqIndex(0, 0) || to === sqIndex(0, 0)) nc &= ~CR.WQ;
        if (from === sqIndex(7, 0) || to === sqIndex(7, 0)) nc &= ~CR.WK;
        if (from === sqIndex(0, 7) || to === sqIndex(0, 7)) nc &= ~CR.BQ;
        if (from === sqIndex(7, 7) || to === sqIndex(7, 7)) nc &= ~CR.BK;
        if (nc !== this.castling) {
            this.keyLo ^= ZC_LO[this.castling]; this.keyHi ^= ZC_HI[this.castling];
            this.keyLo ^= ZC_LO[nc]; this.keyHi ^= ZC_HI[nc];
            this.castling = nc;
        }

        if (this.ep >= 0) {
            this.keyLo ^= ZE_LO[this.ep]; this.keyHi ^= ZE_HI[this.ep];
            this.ep = -1;
        }
        if (flags & MF.DoublePush) {
            this.ep = (from + to) >> 1;
            this.keyLo ^= ZE_LO[this.ep]; this.keyHi ^= ZE_HI[this.ep];
        }

        if (t === PT.Pawn || captured !== 0) this.halfmove = 0; else this.halfmove++;
        if (c === BLACK) this.fullmove++;

        this.side = opp(c);
        this.keyLo ^= ZS_LO; this.keyHi ^= ZS_HI;
    };

    Board.prototype.unmakeMove = function () {
        if (this.stackTop === 0) return;
        this.stackTop--;
        var top = this.stackTop * 10, u = this.undoStack;
        var m = u[top + 0];
        var from = mvFrom(m), to = mvTo(m), promo = mvPromo(m), flags = mvFlags(m);

        if (flags & MF.Castle) {
            var rf, rt;
            if (to === 6) { rf = sqIndex(7, 0); rt = sqIndex(5, 0); }
            else if (to === 2) { rf = sqIndex(0, 0); rt = sqIndex(3, 0); }
            else if (to === 118) { rf = sqIndex(7, 7); rt = sqIndex(5, 7); }
            else { rf = sqIndex(0, 7); rt = sqIndex(3, 7); }
            this.movePiece(rt, rf);
        }

        var piece = this.sq[to], c = colorOf(piece);
        if (promo !== 0) {
            this.removePiece(to);
            this.addPiece(to, mkPiece(PT.Pawn, c));
        }
        this.movePiece(to, from);

        var captured = u[top + 1], capturedSq = u[top + 2];
        if (capturedSq >= 0 && captured !== 0) this.addPiece(capturedSq, captured);

        this.castling = u[top + 3];
        this.ep = u[top + 4];
        this.halfmove = u[top + 5];
        this.fullmove = u[top + 6];
        this.keyLo = u[top + 7];
        this.keyHi = u[top + 8];
        this.side = c;      // 悔棋后轮到刚才走子的一方
    };

    Board.prototype.tryMake = function (m) {
        var mover = colorOf(this.sq[mvFrom(m)]);
        this.makeMove(m);
        if (this.isSquareAttacked(this.kingSq[mover], opp(mover))) {
            this.unmakeMove();
            return false;
        }
        return true;
    };

    Board.prototype.makeNull = function () {
        var top = this.nullTop * 4, u = this.nullStack;
        u[top + 0] = this.ep;
        u[top + 1] = this.halfmove;
        u[top + 2] = this.keyLo;
        u[top + 3] = this.keyHi;
        this.nullTop++;
        if (this.ep >= 0) { this.keyLo ^= ZE_LO[this.ep]; this.keyHi ^= ZE_HI[this.ep]; this.ep = -1; }
        this.halfmove++;
        this.side = opp(this.side);
        this.keyLo ^= ZS_LO; this.keyHi ^= ZS_HI;
    };

    Board.prototype.unmakeNull = function () {
        if (this.nullTop === 0) return;

<script>
/*
 * 复盘（网页 / 手机版）—— 与桌面版同一套逻辑：
 *   · 自动走棋（节奏适中）+ 亲切且不重复的解说
 *   · 关键步：跳过开局定式；亏 ≥0.6 兵 / 一手好棋 / 天平翻面；彼此间隔 ≥4 手、最多 4 个
 *   · 臭棋：退回重下；答对后真的把棋走上去、暂停，等「继续」
 *   · 支持上/下一个关键步跳转
 */
(function (root) {
    'use strict';
    var C = root.Chess;

    // ---------- 逐手打分 ----------
    function build(game, mode, humanSide, progress) {
        var moves = game.moveHistory.slice();
        var steps = [];
        var replay = new C.ChessGame();
        var profile = C.SkillTable.analysisProfile(4, 45);
        var rng = new Rng(20260101);
        var evalBefore = 0;

        for (var i = 0; i < moves.length; i++) {
            var mv = moves[i];
            var side = replay.position.side;
            var pa = C.Analyzer.analyze(replay.position, replay.historyLo, replay.historyHi, profile, rng, new C.Engine());
            var ma = C.Analyzer.judge(pa, mv, side);
            steps.push({
                ply: i, move: mv, san: replay.position.san(mv), whiteMoved: side === C.WHITE,
                lossCp: ma.lossCp || 0, grade: ma.grade || C.Annotations.Good,
                bestMove: pa.bestMove, bestSan: pa.bestMove ? replay.position.san(pa.bestMove) : '',
                evalCp: ma.scoreCp || 0, evalBeforeCp: evalBefore,
                isKey: false, isQuiz: false, kind: ''
            });
            evalBefore = ma.scoreCp || 0;
            replay.play(mv);
            if (progress) progress(i + 1, moves.length);
        }

        var r = { steps: steps, moves: moves, mode: mode, humanSide: humanSide, count: steps.length };
        r.isStudentMove = function (s) { return mode === 'pvp' ? true : s.whiteMoved === (humanSide === C.WHITE); };
        r.gameAt = function (ply) {
            var g = new C.ChessGame();
            for (var k = 0; k < ply && k < moves.length; k++) g.play(moves[k]);
            return g;
        };
        r.keyPlies = function () {
            var out = [];
            for (var k = 0; k < steps.length; k++) if (steps[k].isKey) out.push(k);
            return out;
        };
        r.keyCount = function () { return r.keyPlies().length; };
        r.previousKey = function (before) {
            var ks = r.keyPlies(), found = -1;
            for (var k = 0; k < ks.length; k++) if (ks[k] < before) found = ks[k];
            return found;
        };
        r.nextKey = function (after) {
            var ks = r.keyPlies();
            for (var k = 0; k < ks.length; k++) if (ks[k] > after) return ks[k];
            return -1;
        };
        selectKeys(r);
        return r;
    }

    function selectKeys(r) {
        for (var i = 0; i < r.steps.length; i++) {
            var s = r.steps[i];
            if (!r.isStudentMove(s)) continue;
            if (s.ply < 6) continue;                       // 开局定式
            if (!s.bestSan) continue;                      // 没有"更好"可言
            var bestPlayed = C.mvFrom(s.move) === C.mvFrom(s.bestMove) && C.mvTo(s.move) === C.mvTo(s.bestMove);
            var swing = Math.abs(s.evalCp) >= 150 && Math.abs(s.evalBeforeCp) < 120 &&
                s.evalBeforeCp !== 0 && (s.evalCp > 0) !== (s.evalBeforeCp > 0);

            if (s.lossCp >= 60) {
                s.kind = s.lossCp >= 300 ? 'blunder' : 'mistake';
                s.isKey = true;
            } else if (bestPlayed && s.lossCp <= 15 && s.grade === C.Annotations.Brilliant) {
                s.kind = 'brilliant';
                s.isKey = true;
            } else if (swing) {
                s.kind = 'swing';
                s.isKey = true;
            } else if (bestPlayed && s.lossCp <= 15 && s.ply >= 10 && s.ply <= 40 && s.ply % 7 === 0) {
                s.kind = 'quiet';
                s.isKey = true;
            }
        }

        var keys = [];
        for (var k = 0; k < r.steps.length; k++) if (r.steps[k].isKey) keys.push(r.steps[k]);
        keys.sort(function (a, b) { return weight(b) - weight(a); });

        var chosen = [];
        for (var n = 0; n < keys.length && chosen.length < 4; n++) {
            var close = false;
            for (var m = 0; m < chosen.length; m++) if (Math.abs(chosen[m].ply - keys[n].ply) < 4) close = true;
            if (close) continue;
            chosen.push(keys[n]);
        }
        if (!chosen.length) {
            var worst = null;
            for (var w = 0; w < r.steps.length; w++) {
                var t = r.steps[w];
                if (!r.isStudentMove(t) || !t.bestSan) continue;
                if (!worst || t.lossCp > worst.lossCp) worst = t;
            }
            if (worst) { worst.kind = worst.lossCp >= 300 ? 'blunder' : 'mistake'; chosen.push(worst); }
        }
        for (var a = 0; a < r.steps.length; a++) r.steps[a].isKey = false;
        for (var b2 = 0; b2 < chosen.length; b2++) {
            chosen[b2].isKey = true;
            chosen[b2].isQuiz = chosen[b2].kind === 'blunder' || chosen[b2].lossCp >= 200;
        }
    }

    function weight(s) {
        var w = s.lossCp;
        if (s.kind === 'brilliant') w += 800;
        if (s.kind === 'swing') w += 600;
        if (s.kind === 'blunder') w += 400;
        if (s.kind === 'quiet') w -= 200;
        return w;
    }

    function Rng(seed) { this.s = seed >>> 0 || 1; }
    Rng.prototype.next = function () {
        this.s ^= this.s << 13; this.s >>>= 0;
        this.s ^= this.s >>> 17;
        this.s ^= this.s << 5; this.s >>>= 0;
        return this.s / 4294967296;
    };

    // ---------- 解说（短句、具体；宁可不说话） ----------
    function side(white) { return white ? '白' : '黑'; }
    function paws(cp) { return (Math.abs(cp) / 100).toFixed(1); }
    function pieceName(p) {
        switch (C.typeOf(p)) {
            case C.PT.Pawn: return '兵';
            case C.PT.Knight: return '马';
            case C.PT.Bishop: return '象';
            case C.PT.Rook: return '车';
            case C.PT.Queen: return '后';
            case C.PT.King: return '王';
        }
        return '子';
    }

    var SP = {
        intro: function (r) {
            if (!r.count) return '没有棋谱，复盘不了。';
            var who = r.mode === 'pvp' ? '你们' : '你';
            return r.count + ' 手，一起过一遍。关键的几处我会停下来，' + who + '走坏的地方会退回让你重下。';
        },
        plain: function (r, s) {
            var before = r.gameAt(s.ply), b = before.position;
            var captured = b.sq[C.mvTo(s.move)];
            var isCap = captured !== 0 || (C.mvFlags(s.move) & C.MF.EnPassant);
            var castle = (C.mvFlags(s.move) & C.MF.Castle) !== 0;
            var promo = (C.mvPromo(s.move) || 0) !== 0;
            var type = C.typeOf(b.sq[C.mvFrom(s.move)]);
            var after = r.gameAt(s.ply + 1);
            var check = after.position.inCheck(after.position.side);
            var note;
            if (castle) note = '易位，王先安顿好';
            else if (promo) note = '升变！小兵成后';
            else if (isCap && check) note = '吃子还带将军';
            else if (isCap) note = '吃' + pieceName(captured);
            else if (check) note = '将军';
            else if (type === C.PT.King) note = '王挪一格';
            else if (type === C.PT.Pawn) {
                var f = C.fileOf(C.mvTo(s.move)), rk = C.rankOf(C.mvTo(s.move));
                note = ((f === 3 || f === 4) && (rk === 3 || rk === 4)) ? '抢中心' : '推兵';
            }
            else if (type === C.PT.Queen && s.ply < 12) note = '后早出，当心被追';
            else if (type === C.PT.Knight || type === C.PT.Bishop) note = '出子';
            else note = '重子上场';
            if ((note === '推兵' || note === '出子') && s.ply % 2 === 1) note = '';
            return note ? (s.san + '——' + note) : s.san;
        },
        evalLine: function (r, s) {
            var cp = s.evalCp, rate = Math.round(C.AnalysisMath.winRate(cp));
            if (cp > 29000) return '白方胜势。';
            if (cp < -29000) return '黑方胜势。';
            if (rate >= 70) return '白方舒服（' + rate + '%）。';
            if (rate >= 58) return '白方稍好（' + rate + '%）。';
            if (rate > 42) return '均势（' + rate + '%）。';
            if (rate > 30) return '黑方稍好（' + rate + '%）。';
            return '黑方占上风（' + rate + '%）。';
        },
        deep: function (r, s) {
            var loss = (s.lossCp / 100).toFixed(1);
            if (s.kind === 'brilliant') return '这步 ' + s.san + ' 是这盘里最准的一手——别的走法都会松劲。拿住了。';
            if (s.kind === 'swing') return '局面就是从这儿翻的。' + side(s.whiteMoved) + '方这一手之后，主动换边了。';
            if (s.kind === 'quiet') return s.san + ' 不起眼，但很干净：没送、没乱动。';
            if (s.kind === 'blunder' || s.lossCp >= 200)
                return s.san + ' 亏了 ' + loss + ' 个兵。' + (s.bestSan ? '换 ' + s.bestSan + ' 就还稳。' : '');
            return s.san + ' 差了点，约 ' + loss + ' 个兵；' + (s.bestSan ? s.bestSan + ' 更稳。' : '本可以更稳。');
        },
        quizPrompt: function (r, s) { return '换你来：这个局面该走哪步？'; },
        quizRight: function (r, s, played) { return '对，就是 ' + played + '。比实战的 ' + s.san + ' 稳得多。'; },
        quizWrong: function (r, s, played, lossCp, tries) {
            var head = tries <= 1 ? played + ' 不行' : '还是不行';
            if (lossCp > 0) return head + '——要亏 ' + (lossCp / 100).toFixed(1) + ' 个兵。再试。';
            return head + '——这样会让出主动。再试。';
        },
        hint: function (s) { return s.bestSan ? ('提示：走 ' + s.bestSan + '。') : '提示：先动没发挥作用的子。'; },
        backToGame: function (r, s) { return '实战走的是 ' + s.san + '，接着看。'; },
        jumpForward: function (r, s) { return '→ 第 ' + (s.ply + 1) + ' 手 ' + s.san + '。'; },
        jumpBack: function (r, s) { return '← 第 ' + (s.ply + 1) + ' 手 ' + s.san + '。'; },
        outro: function (r) {
            var bl = 0, mi = 0, br = 0;
            for (var i = 0; i < r.steps.length; i++) {
                var s = r.steps[i];
                if (!r.isStudentMove(s)) continue;
                if (s.kind === 'brilliant') br++;
                else if (s.kind === 'blunder') bl++;
                else if (s.kind === 'mistake') mi++;
            }
            var tail;
            if (br > 0 && bl === 0 && mi === 0) tail = br + ' 步很亮，几乎没送东西。';
            else if (bl > 0) tail = '踩了 ' + bl + ' 个坑，记住就值。' + (br > 0 ? '顺便说，' + br + ' 步好棋也不错。' : '');
            else if (mi > 0) tail = '几处小亏，补上就上一档。';
            else tail = '下得很干净。';
            return '复盘结束。' + tail;
        }
    };

    // ---------- 教学状态机 ----------
    function Lesson(review) {
        this.review = review;
        this.rng = new Rng(20260101);
        this.reset();
    }

    Lesson.prototype.reset = function () {
        this.ply = 0;
        this.mode = this.review.count > 0 ? 'auto' : 'done';
        this.tries = 0;
        this.feedback = '';
        this.tick = 0;
        this.log = [];
        this.logPly = [];
        this.quizMove = 0;
        this.quizSan = '';
        this.say(SP.intro(this.review));
    };

    Lesson.prototype.say = function (line) {
        if (!line) return;
        this.log.push(line);
        this.logPly.push(this.ply);
    };
    Lesson.prototype.waiting = function () {
        return this.mode === 'key' || this.mode === 'quiz' || this.mode === 'correct' || this.mode === 'done';
    };
    Lesson.prototype.currentStep = function () {
        var i = this.mode === 'key' ? this.ply - 1 : this.ply;
        return (i >= 0 && i < this.review.count) ? this.review.steps[i] : null;
    };
    Lesson.prototype.displayPly = function () {
        return this.mode === 'quiz' ? this.ply : Math.min(this.ply, this.review.count);
    };

    Lesson.prototype.advance = function () {
        if (this.mode !== 'auto') return false;
        if (this.ply >= this.review.count) { this.finish(); return false; }
        var s = this.review.steps[this.ply];
        if (s.isKey && s.isQuiz) {
            this.mode = 'quiz'; this.tries = 0; this.feedback = '';
            this.quizMove = 0; this.quizSan = '';
            this.say(SP.quizPrompt(this.review, s));
            return false;
        }
        this.ply++;
        this.say(SP.plain(this.review, s));
        this.tick++;
        if (this.tick % 4 === 0) this.say(SP.evalLine(this.review, s));
        if (s.isKey) {
            this.mode = 'key'; this.feedback = '';
            this.say(SP.deep(this.review, s));
            return false;
        }
        return true;
    };

    Lesson.prototype.cont = function () {
        if (this.mode === 'key') { this.mode = 'auto'; this.feedback = ''; return; }
        if (this.mode === 'correct') {
            var s = this.review.steps[this.ply - 1];
            this.quizMove = 0; this.quizSan = '';
            this.mode = 'auto'; this.feedback = '';
            this.say(SP.backToGame(this.review, s));
            this.tick = 0;
        }
    };

    Lesson.prototype.submit = function (move) {
        if (this.mode !== 'quiz') return { verdict: 'ignored', message: '' };
        var s = this.review.steps[this.ply];
        var pre = this.review.gameAt(this.ply);
        var pa = C.Analyzer.analyze(pre.position, pre.historyLo, pre.historyHi,
            C.SkillTable.analysisProfile(4, 45), this.rng, new C.Engine());
        var ma = C.Analyzer.judge(pa, move, pre.position.side);
        this.tries++;
        var played = pre.position.san(move);
        var exact = C.mvFrom(s.bestMove) === C.mvFrom(move) && C.mvTo(s.bestMove) === C.mvTo(move);
        var correct = exact || (ma.lossCp || 0) <= 50;

        if (correct) {
            this.quizMove = move;
            this.quizSan = played;
            this.ply++;
            this.mode = 'correct';
            this.feedback = '对了！';
            var ok = SP.quizRight(this.review, s, played);
            this.say(ok);
            return { verdict: 'correct', message: ok };
        }
        var bad = SP.quizWrong(this.review, s, played, ma.lossCp || 0, this.tries);
        this.feedback = '再想想';
        this.say(bad);
        if (this.tries >= 2) { this.say(SP.hint(s)); this.feedback = '提示已给出'; }
        return { verdict: 'wrong', message: bad };
    };

    /** 回到上一步：把对话逐行还原到那一刻（不追加新句子） */
    Lesson.prototype.stepBack = function () {
        if (this.ply <= 0) return false;
        this.quizMove = 0; this.quizSan = ''; this.tries = 0; this.feedback = '';
        this.ply--;
        this.mode = 'auto';
        this.tick = this.ply;
        var keep = 0;
        while (keep < this.logPly.length && this.logPly[keep] <= this.ply) keep++;
        this.log.length = keep;
        this.logPly.length = keep;
        return true;
    };

    Lesson.prototype.canStepBack = function () { return this.ply > 0; };

    Lesson.prototype.jump = function (dir) {
        var here = this.mode === 'key' ? this.ply - 1 : this.ply;
        var target = dir < 0 ? this.review.previousKey(here) : this.review.nextKey(here);
        if (target < 0) return false;
        var s = this.review.steps[target];
        this.quizMove = 0; this.quizSan = ''; this.tries = 0; this.feedback = '';
        this.ply = s.isQuiz ? target : target + 1;
        this.mode = s.isQuiz ? 'quiz' : 'key';
        this.say(dir < 0 ? SP.jumpBack(this.review, s) : SP.jumpForward(this.review, s));
        this.say(s.isQuiz ? SP.quizPrompt(this.review, s) : SP.deep(this.review, s));
        return true;
    };

    Lesson.prototype.canJump = function (dir) {
        var here = this.mode === 'key' ? this.ply - 1 : this.ply;
        return dir < 0 ? this.review.previousKey(here) >= 0 : this.review.nextKey(here) >= 0;
    };

    Lesson.prototype.finish = function () {
        this.mode = 'done'; this.feedback = '';
        this.say(SP.outro(this.review));
    };

    Lesson.prototype.progressText = function () {
        var seen = 0, total = 0;
        for (var i = 0; i < this.review.steps.length; i++) {
            if (!this.review.steps[i].isKey) continue;
            total++;
            if (i < this.ply) seen++;
        }
        return '第 ' + Math.min(this.ply, this.review.count) + ' / ' + this.review.count +
            ' 手 · 关键步 ' + Math.min(seen, total) + ' / ' + total;
    };

    root.ChessReview = { build: build, Lesson: Lesson, Speed: 1150 };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 手机版界面：canvas 棋盘 + 触摸交互 + 三个界面（主页 / 难度 / 对局）+ AI 解析面板
 * 依赖 engine.js（规则与引擎）与 pieces.js（棋子精灵图，base64）
 */
(function () {
    'use strict';

    var C = window.Chess;
    var WHITE = C.WHITE, BLACK = C.BLACK;
    var ANALYSIS_DEPTH = 5, ANALYSIS_MS = 350;     // 手机端解析档位（比桌面轻一些）
    var AI_MIN_THINK_MS = 450;                     // 电脑最少"思考"时间，避免瞬间落子

    // ---------------- 元素 ----------------
    function $(id) { return document.getElementById(id); }
    var screens = { home: $('screen-home'), difficulty: $('screen-difficulty'), game: $('screen-game'),
        openings: $('screen-openings'), study: $('screen-study'),
        review: $('screen-review') };
    var canvas = $('board'), ctx = canvas.getContext('2d');
    var chart = $('chart'), cctx = chart.getContext('2d');
    var sheet = new Image();

    // ---------------- 状态 ----------------
    var app = {
        screen: 'home',
        mode: 'ai',                 // ai | pvp
        skill: null,
        game: null,
        humanSide: WHITE,
        aiThinking: false,
        aiTimer: null,
        selected: -1,
        targets: [],
        lastMove: 0,
        analysisOn: false,
        showControl: false,         // 是否叠加显示控制格（双方攻击范围）
        analyses: [],               // 按 ply 索引
        annotations: [],            // 按手数索引
        analysisQueue: [],
        analysisRunning: false,
        analysisGen: 0,
        promoResolve: null
    };

    var AI_SIDE = BLACK, HUMAN_SIDE = WHITE;

    // ---------------- 通用 ----------------
    function showScreen(name) {
        app.screen = name;
        for (var k in screens) {
            if (screens.hasOwnProperty(k)) screens[k].classList.toggle('active', k === name);
        }
        if (name === 'game') resizeAll();
    }

    function setText(id, text) { var el = $(id); if (el) el.textContent = text; }

    // 棋子颜色（与桌面版一致的配色）
    var SYM_COLOR = {
        '!!': '#1B7F79', '!': '#4E7C6A', '!?': '#7A935C', '?!': '#C09635', '?': '#D2762F', '??': '#C25B4E', '…': '#8E8B84'
    };
    function symColor(sym) { return SYM_COLOR[sym] || '#8E8B84'; }

    // ---------------- 棋盘绘制 ----------------
    var boardSize = 0, cell = 0;

    /** 真正的布局视口宽度（headless 下 window.innerWidth 可能偏大，取两者较小值最稳） */
    function viewportWidth() {
        var a = window.innerWidth || 99999;
        var b = document.documentElement ? (document.documentElement.clientWidth || 99999) : 99999;
        return Math.min(a, b);
    }

    function layoutBoard() {
        var wrap = document.querySelector('.board-wrap');
        var area = document.querySelector('.board-area');
        if (!wrap || !area) return;
        var cs = window.getComputedStyle(area);
        var pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
        var availW = area.clientWidth - pad;
        // 高度以 .game-body 为准：它现在是"棋盘 + 下方面板"的整体滚动容器，
        // 棋盘先占满第一屏，往下滚动即可看到走棋记录与 AI 解析。
        var body = document.querySelector('.game-body');
        var bodyH = body ? body.clientHeight : 0;
        var availH = (bodyH > 60 ? bodyH : area.clientHeight) - 12;
        var vw = viewportWidth();
        var size = Math.min(availW, Math.max(availH, 160));
        if (window.__dbg) {
            var gs = document.getElementById('screen-game');
            var tb = document.querySelector('#screen-game .topbar');
            var apx = document.getElementById('app');
            document.title = 'vw=' + vw + ' vh=' + window.innerHeight + ' appH=' + (apx ? apx.clientHeight : -1) +
                ' screenH=' + (gs ? gs.clientHeight : -1) + ' topbarH=' + (tb ? tb.clientHeight : -1) +
                ' areaW=' + area.clientWidth + ' availH=' + availH + ' size=' + Math.floor(size);
        }
        if (!(size > 0)) size = Math.max(160, vw - 12);
        if (vw > 0 && size > vw - 8) size = vw - 8;
        size = Math.max(120, Math.floor(size));
        if (size === boardSize) return;
        boardSize = size;
        cell = size / 8;
        var dpr = window.devicePixelRatio || 1;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawBoard();
    }

    function resizeAll() {
        layoutBoard();
        layoutChart();
    }

    function rectOf(sq, whiteBottom) {
        var r = C.rankOf(sq), f = C.fileOf(sq);
        var col = whiteBottom ? f : 7 - f;
        var row = whiteBottom ? 7 - r : r;
        return { x: col * cell, y: row * cell, w: cell, h: cell };
    }

    function squareAt(px, py, whiteBottom) {
        var col = Math.floor(px / cell), row = Math.floor(py / cell);
        if (col < 0 || col > 7 || row < 0 || row > 7) return -1;
        var f = whiteBottom ? col : 7 - col;
        var r = whiteBottom ? 7 - row : row;
        return C.sqIndex(f, r);
    }

    // 「控制格」四色：黑方控制 → 黑；白方控制 → 白；双方 → 浅灰；都没 → 浅绿（棋盘主色）
    var CONTROL_COLORS = { black: '#33322E', white: '#FFFFFF', both: '#D8D6D0', none: '#A7B69D' };

    function controlColor(hasWhite, hasBlack) {
        if (hasWhite && hasBlack) return CONTROL_COLORS.both;
        if (hasBlack) return CONTROL_COLORS.black;
        if (hasWhite) return CONTROL_COLORS.white;
        return CONTROL_COLORS.none;
    }

    function drawBoard() {
        if (!app.game || boardSize === 0) return;
        var b = app.game.position;
        var whiteBottom = whiteBottomNow();
        ctx.clearRect(0, 0, boardSize, boardSize);

        // 「控制格」视图：整块棋盘按"谁控制这一格"重新上色，覆盖原来的深浅格
        var controlView = !!app.showControl;
        var wm = 0, bm = 0;
        if (controlView) {
            wm = b.controlledSquares(WHITE);
            bm = b.controlledSquares(BLACK);
        }
        for (var r = 0; r < 8; r++) {
            for (var f = 0; f < 8; f++) {
                var sq = C.sqIndex(f, r);
                var rc = rectOf(sq, whiteBottom);
                if (controlView) {
                    ctx.fillStyle = controlColor(C.controlHas(wm, f, r), C.controlHas(bm, f, r));
                } else {
                    ctx.fillStyle = ((f + r) % 2 !== 0) ? '#F1ECE2' : '#A7B69D';
                }
                ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
            }
        }
        if (controlView) {
            // 淡网格线：同色的相邻格否则会连成一片
            ctx.strokeStyle = 'rgba(110,108,102,0.16)';
            ctx.lineWidth = 1;
            for (var gi = 1; gi < 8; gi++) {
                ctx.beginPath(); ctx.moveTo(gi * cell, 0); ctx.lineTo(gi * cell, boardSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, gi * cell); ctx.lineTo(boardSize, gi * cell); ctx.stroke();
            }
        }

        // 上一步高亮（控制格视图下会干扰色块辨识，故不画）
        if (app.lastMove && !controlView) {
            ctx.fillStyle = 'rgba(78,124,106,0.18)';
            var a = rectOf(C.mvFrom(app.lastMove), whiteBottom);
            var c = rectOf(C.mvTo(app.lastMove), whiteBottom);
            ctx.fillRect(a.x, a.y, a.w, a.h);
            ctx.fillRect(c.x, c.y, c.w, c.h);
        }
        // 被将军
        if (b.inCheck(b.side)) {
            var k = b.kingSq[b.side];
            if (k || b.sq[0] === C.mkPiece(C.PT.King, b.side)) {
                var kr = rectOf(k, whiteBottom);
                ctx.fillStyle = 'rgba(194,91,78,0.35)';
                ctx.fillRect(kr.x, kr.y, kr.w, kr.h);
            }
        }
        // 选中
        if (app.selected >= 0) {
            var sr = rectOf(app.selected, whiteBottom);
            ctx.fillStyle = 'rgba(78,124,106,0.32)';
            ctx.fillRect(sr.x, sr.y, sr.w, sr.h);
        }
        // 可走点
        for (var i = 0; i < app.targets.length; i++) {
            var to = C.mvTo(app.targets[i]);
            var tr = rectOf(to, whiteBottom);
            var isCap = b.sq[to] !== 0 || (C.mvFlags(app.targets[i]) & C.MF.EnPassant);
            if (isCap) {
                ctx.strokeStyle = 'rgba(60,98,83,0.55)';
                ctx.lineWidth = Math.max(2, cell * 0.055);
                ctx.beginPath();
                var inset = cell * 0.08;
                ctx.arc(tr.x + tr.w / 2, tr.y + tr.h / 2, tr.w / 2 - inset, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = 'rgba(60,98,83,0.35)';
                ctx.beginPath();
                ctx.arc(tr.x + tr.w / 2, tr.y + tr.h / 2, cell * 0.155, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 棋子（精灵图）
        if (sheet.complete && sheet.naturalWidth > 0) {
            for (var rr = 0; rr < 8; rr++) {
                for (var ff = 0; ff < 8; ff++) {
                    var s2 = C.sqIndex(ff, rr);
                    var p = b.sq[s2];
                    if (p === 0) continue;
                    var rc2 = rectOf(s2, whiteBottom);
                    var type = C.typeOf(p), color = C.colorOf(p);
                    var sx = (type - 1) * 128, sy = (color === WHITE ? 0 : 1) * 128;
                    var pad = cell * 0.06;
                    if (controlView && color === BLACK) {
                        // 黑棋在"黑方控制"的黑格上会看不清 —— 加一层白色光晕
                        ctx.shadowColor = '#FFFFFF';
                        ctx.shadowBlur = cell * 0.10;
                    }
                    ctx.drawImage(sheet, sx, sy, 128, 128, rc2.x + pad, rc2.y + pad, rc2.w - pad * 2, rc2.h - pad * 2);
                    if (controlView && color === BLACK) {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }


        // 坐标
        ctx.fillStyle = 'rgba(60,98,83,0.55)';
        ctx.font = Math.max(9, Math.round(cell * 0.19)) + 'px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        for (var i2 = 0; i2 < 8; i2++) {
            var file = whiteBottom ? i2 : 7 - i2;
            ctx.fillText(String.fromCharCode(97 + file), i2 * cell + 3, boardSize - cell + 3);
            var rank = whiteBottom ? 7 - i2 : i2;
            ctx.fillText(String(rank + 1), 3, i2 * cell + 3);
        }
    }

    function whiteBottomNow() {
        if (app.mode === 'pvp') return app.game.position.side === WHITE;
        return app.humanSide === WHITE;    // 人机对战：己方始终在下方
    }

    // ---------------- 触摸交互 ----------------
    // 说明：不用 Pointer Events（需要 Chrome 55+），改用 touchstart + mousedown，
    // 老机型上的 WebView 也能正常落子。
    var lastTouchAt = 0;
    function onBoardDown(ev) {
        if (ev.type === 'mousedown' && (Date.now() - lastTouchAt) < 700) return;   // 触摸后的兼容鼠标事件，忽略
        if (ev.type === 'touchstart') {
            lastTouchAt = Date.now();
            if (ev.preventDefault) ev.preventDefault();
        }
        var src = (ev.touches && ev.touches.length) ? ev.touches[0] : ev;
        if (!app.game || app.game.isOver() || app.aiThinking) return;
        var rect = canvas.getBoundingClientRect();
        var x = (src.clientX - rect.left), y = (src.clientY - rect.top);
        var sq = squareAt(x, y, whiteBottomNow());
        if (sq < 0) return;
        var b = app.game.position;
        if (app.mode === 'ai' && b.side !== app.humanSide) return;

        var p = b.sq[sq];
        if (p !== 0 && C.colorOf(p) === b.side) {
            if (app.selected === sq) { app.selected = -1; app.targets = []; }
            else { app.selected = sq; app.targets = app.game.legalMovesFrom(sq); }
            drawBoard();
            return;
        }
        if (app.selected >= 0) {
            for (var i = 0; i < app.targets.length; i++) {
                if (C.mvTo(app.targets[i]) === sq) {
                    var from = app.selected;
                    var cands = [];
                    for (var k = 0; k < app.targets.length; k++) {
                        if (C.mvTo(app.targets[k]) === sq) cands.push(app.targets[k]);
                    }
                    app.selected = -1; app.targets = [];
                    if (cands.length > 1) {
                        askPromotion(b.side).then(function (piece) {
                            var chosen = cands[0];
                            for (var j = 0; j < cands.length; j++) if (C.mvPromo(cands[j]) === piece) chosen = cands[j];
                            applyMove(chosen);
                        });
                    } else {
                        applyMove(cands[0]);
                    }
                    return;
                }
            }
        }
        app.selected = -1; app.targets = [];
        drawBoard();
    }
    canvas.addEventListener('touchstart', onBoardDown, false);
    canvas.addEventListener('mousedown', onBoardDown, false);

    // ---------------- 对局流程 ----------------
    function startGame(mode, skill) {
        hideReviewButton();
        app.mode = mode;
        app.skill = skill;
        app.game = new C.ChessGame();
        if (mode !== 'ai') app.humanSide = WHITE;      // 人机对战沿用难度页选的执子
        app.aiThinking = false;
        app.selected = -1; app.targets = []; app.lastMove = 0;
        app.analyses = []; app.annotations = []; app.analysisQueue = [];
        app.analysisGen++;
        if (mode === 'ai') {
            setText('gameTitle', '人机对战');
            setText('gameSub', 'ELO ' + skill.elo + ' · ' + skill.tier + ' · ' + (app.humanSide === WHITE ? '你执白先行' : '你执黑后行'));
            $('btnAnalysis').style.display = '';
        } else {
            setText('gameTitle', '人人对战（本地）');
            setText('gameSub', '每走一步自动翻转棋盘');
            $('btnAnalysis').style.display = 'none';
            app.analysisOn = false;
            $('analysis').classList.remove('on');
            $('btnAnalysis').classList.remove('on');
            $('btnAnalysis').textContent = 'AI 解析 · 关';
        }
        showScreen('game');
        updateHud();
        renderMoves();
        drawBoard();
        if (app.analysisOn) requestAnalysis(app.game.plyCount());
        if (mode === 'ai' && app.game.position.side !== app.humanSide) startAiTurn();
    }

    function applyMove(m) {
        if (!app.game.play(m)) return;
        app.lastMove = m;
        app.selected = -1; app.targets = [];
        updateHud();
        renderMoves();
        drawBoard();

        // AI 解析（若开启）：先给这一手定级，再排当前局面的分析
        if (app.analysisOn) {
            var idx = app.game.plyCount() - 1;
            var pa = app.analyses[idx];
            if (pa) {
                var mover = (idx % 2 === 0) ? WHITE : BLACK;
                app.annotations[idx] = C.Analyzer.judge(pa, app.game.moveHistory[idx], mover);
            }
            requestAnalysis(idx);
            requestAnalysis(app.game.plyCount());
            renderAnalysis();
            renderMoves();
        }

        if (app.game.isOver()) { showResult(); return; }
        if (app.mode === 'ai' && app.game.position.side !== app.humanSide) startAiTurn();
    }

    function startAiTurn() {
        if (app.aiThinking || app.game.isOver()) return;
        app.aiThinking = true;
        updateHud();
        var dots = 0;
        var ticker = setInterval(function () {
            if (!app.aiThinking) return;
            dots = (dots + 1) % 4;
            setText('turnText', '电脑思考中' + new Array(dots + 1).join('.'));
        }, 300);
        // 先让界面把"思考中"画出来，再跑同步搜索（WebView 里没有 Worker，用一次让步来避免白屏）
        setTimeout(function () {
            var snapshot = app.game.position.clone();
            var eng = new C.Engine();
            var rng = mulberry32((Date.now() ^ (app.game.plyCount() * 2654435761)) >>> 0);
            var t0 = Date.now();
            var result = null;
            try {
                result = eng.search(snapshot, app.game.keysLo, app.game.keysHi, app.skill, rng);
            } catch (e) { result = null; }
            var wait = AI_MIN_THINK_MS - (Date.now() - t0);
            if (wait > 0) {
                setTimeout(function () { finishAi(result); }, wait);
            } else {
                finishAi(result);
            }
            function finishAi(res) {
                clearInterval(ticker);
                app.aiThinking = false;
                if (!res) { updateHud(); return; }
                var legal = app.game.legalMoves();
                var chosen = null;
                for (var i = 0; i < legal.length; i++) if (C.sameMove(legal[i], res.move)) { chosen = legal[i]; break; }
                if (!chosen && legal.length > 0) chosen = legal[0];
                if (!chosen) { updateHud(); return; }
                applyMove(chosen);
            }
        }, 40);
    }

    function mulberry32(a) {
        return function () {
            a |= 0; a = (a + 0x6D2B79F5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function updateHud() {
        var b = app.game.position;
        $('turnDot').className = 'dot ' + (b.side === WHITE ? 'white' : 'black');
        var turn;
        if (app.aiThinking) turn = '电脑思考中…';
        else if (app.game.isOver()) {
            turn = app.game.state === C.GS.Checkmate
                ? (app.game.winner === WHITE ? '白方获胜' : '黑方获胜') : '和棋';
        } else {
            turn = b.side === WHITE ? '白方走棋' : '黑方走棋';
            if (app.mode === 'ai') turn += (b.side === app.humanSide) ? '（你）' : '（电脑）';
        }
        setText('turnText', turn);
        setText('roundText', '第 ' + b.fullmove + ' 回合');
        var st = '', cls = 'status';
        if (app.game.isOver()) { st = app.game.stateReason(); if (app.game.state === C.GS.Checkmate) cls += ' check'; }
        else if (!app.aiThinking && b.inCheck(b.side)) { st = '将军！'; cls += ' check'; }
        var el = $('statusText');
        el.textContent = st;
        el.className = cls;
        $('btnUndo').disabled = app.aiThinking || app.game.plyCount() === 0;
    }

    function renderMoves() {
        var box = $('moves');
        var sans = app.game.sanHistory;
        if (sans.length === 0) { box.innerHTML = '<div class="empty">对局尚未开始</div>'; return; }
        var rows = Math.ceil(sans.length / 2);
        var html = '';
        for (var i = 0; i < rows; i++) {
            var last = (i === rows - 1);
            html += '<div class="mv' + (last ? ' cur' : '') + '">';
            html += '<span class="no">' + (i + 1) + '.</span>';
            html += '<span class="san">' + sans[i * 2] + '</span>';
            html += '<span class="sym" style="color:' + symOf(i * 2) + '">' + symText(i * 2) + '</span>';
            if (i * 2 + 1 < sans.length) {
                html += '<span class="san2">' + sans[i * 2 + 1] + '</span>';
                html += '<span class="sym2" style="color:' + symOf(i * 2 + 1) + '">' + symText(i * 2 + 1) + '</span>';
            }
            html += '</div>';
        }
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
